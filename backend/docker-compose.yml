# Sobe api + banco isolados, sem frontend.
# Para a stack completa, use o compose da raiz.
name: ${APP_NAME:-boilerplate}-backend

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: [../.env]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen(
                  "http://localhost:8000/api/v1/health/ready", timeout=3
              ).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-boilerplate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boilerplate}
      POSTGRES_DB: ${DB_NAME:-boilerplate}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-boilerplate} -d ${DB_NAME:-boilerplate}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
