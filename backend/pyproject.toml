[project]
name = "boilerplate-back"
version = "0.1.0"
description = "Backend do boilerplate LopesTech"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "dependency-injector==4.49.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8.0",
    "black>=25.1.0",
    "httpx>=0.28.0",
    "import-linter>=2.1",
    "isort>=6.0.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "radon>=6.0.0",
    "ruff>=0.8.0",
    "testcontainers[postgres]>=4.9.0",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
src_paths = ["src"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dependency_injector.*", "alembic.*", "argon2.*", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.main"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
markers = [
    "unit: testes unitários",
    "integration: testes de integração",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.vulture]
paths = ["src/app"]
min_confidence = 80

[tool.bandit]
exclude_dirs = [".venv", "src/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "C90"]
mccabe = { max-complexity = 10 }

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"src/app/api/*" = ["B008"]

# ─────────────────────────────────────────────────────────────────────────────
#  A regra de dependência, como verificação automática.
#  Ver .claude/rules/architecture.md e docs/adr/0001.
# ─────────────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "As camadas respeitam a regra de dependência"
type = "layers"
layers = [
    "app.seed",
    "app.main",
    "app.config",
    "app.api | app.repositories",
    "app.schemas",
    "app.use_cases",
    "app.entities",
]

[[tool.importlinter.contracts]]
name = "entities não importa nada do projeto"
type = "forbidden"
source_modules = ["app.entities"]
forbidden_modules = [
    "app.use_cases",
    "app.repositories",
    "app.api",
    "app.schemas",
    "app.config",
    "app.main",
]

[[tool.importlinter.contracts]]
name = "use_cases não conhece framework, ORM nem HTTP"
type = "forbidden"
source_modules = ["app.use_cases"]
forbidden_modules = ["fastapi", "sqlalchemy", "starlette", "pydantic", "jwt", "argon2"]

[[tool.importlinter.contracts]]
name = "entities não conhece framework nem ORM"
type = "forbidden"
source_modules = ["app.entities"]
forbidden_modules = ["fastapi", "sqlalchemy", "starlette", "pydantic"]
