name: Quality

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LINK_MODE: copy
  UV_COMPILE_BYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gates:
    name: Portões de qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependências
        run: uv sync --extra dev --frozen

      # Roda exatamente os mesmos hooks do pre-commit local.
      # Os testes de integração sobem Postgres via Testcontainers, usando o
      # Docker que o runner já provê.
      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  contract:
    name: Contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Subir a stack
        run: |
          cp .env.example .env
          make up

      - name: Aplicar migrations
        run: make migrate

      - name: Validar contra contract/openapi.yaml
        run: make contract-test

      - name: Logs da api em caso de falha
        if: failure()
        run: docker compose logs api

      - name: Derrubar
        if: always()
        run: make clean
