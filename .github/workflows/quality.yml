name: Quality

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LINK_MODE: copy
  UV_COMPILE_BYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências
        run: uv --directory backend sync --extra dev --frozen

      # Os mesmos hooks do pre-commit local. Os testes de integração sobem
      # Postgres via Testcontainers, no Docker do runner.
      - name: pre-commit
        run: uv --directory backend run pre-commit run --all-files --show-diff-on-failure

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [react, vue, angular]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Habilitar pnpm
        run: corepack enable pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O contrato é a fonte da verdade: se os tipos gerados divergirem do que
      # está versionado, alguém mexeu na API sem rodar `make codegen`.
      - name: Os tipos gerados estão em dia com o contrato?
        run: |
          pnpm run codegen
          git diff --exit-code src/data/api/schema.d.ts

      - name: Portões
        run: pnpm run lint

      - name: Testes
        run: pnpm run test

      - name: Build
        run: pnpm run build

  contract:
    name: Contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir a stack, só o backend
        run: |
          cp .env.example .env
          make up FRONT=none
          make migrate

      - name: Validar contra contract/openapi.yaml
        run: make contract-test

      - name: Logs da api em caso de falha
        if: failure()
        run: docker compose logs api

      - name: Derrubar
        if: always()
        run: make clean

  e2e:
    name: E2E (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [react, vue, angular]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Habilitar pnpm
        run: corepack enable pnpm

      - name: Instalar o Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      # A stack inteira pelo compose da raiz, como em qualquer máquina.
      # O mesmo roteiro para os três: se algum precisar de tratamento especial
      # aqui, o comportamento divergiu.
      - name: Jornada completa
        run: |
          cp .env.example .env
          make e2e FRONT=${{ matrix.app }}

      - name: Relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.app }}
          path: e2e/playwright-report/
          retention-days: 7

      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile ${{ matrix.app }} logs

      - name: Derrubar
        if: always()
        run: make clean
