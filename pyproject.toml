[project]
name = "boilerplate-back"
version = "0.1.0"
description = "Toda Matemática API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "dependency-injector==4.49.0",
    "fastapi>=0.115.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8.0",
    "black>=25.1.0",
    "httpx>=0.28.0",
    "isort>=6.0.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "radon>=6.0.0",
    "ruff>=0.8.0",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
src_paths = ["src"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dependency_injector.*", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.main"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
markers = [
    "unit: testes unitários",
    "integration: testes de integração",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.vulture]
paths = ["src/app"]
min_confidence = 80

[tool.bandit]
exclude_dirs = [".venv", "src/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "C90"]
mccabe = { max-complexity = 10 }

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
"src/app/api/*" = ["B008"]
"src/tests/*" = ["S101"]
